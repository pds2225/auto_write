name: temp-step3a-test

on:
  pull_request:
    branches:
      - cursor/step2-baseline-run-e248
  push:
    branches:
      - feat/step3a-section-matcher-20260816

permissions:
  contents: read

jobs:
  step3a-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run STEP3A matcher tests
        env:
          PYTHONPATH: app
        run: python -m pytest app/tests/test_section_matcher.py -q

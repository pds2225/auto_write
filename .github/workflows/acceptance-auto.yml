name: acceptance-auto

on:
  pull_request:
    paths:
      - "app/acceptance_tests/**"
      - "app/auto_write/services/announcement_analyzer.py"
      - "app/auto_write/services/form_analyzer.py"
      - "app/auto_write/services/company_extract.py"
      - "app/auto_write/services/hwpx_submit.py"
      - "app/auto_write/services/hwpx_integrity_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-auto:
    name: acceptance-auto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pytest

      - name: Run AUTO acceptance contracts
        env:
          PYTHONPATH: app
        run: |
          python -m pytest app/acceptance_tests/test_auto_at_002_003_005_007_010.py -q
